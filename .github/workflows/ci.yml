name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Syntax check
        run: python -m py_compile index.py api/index.py

      - name: Lint (pyflakes)
        run: pyflakes index.py api/index.py bot_app/ tests/ scripts/

      - name: Run tests
        run: pytest -q

      - name: Verify Vercel config
        run: |
          python -c "import json; json.load(open('vercel.json')); print('vercel.json OK')"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            dashboard/package-lock.json
            mini_app/package-lock.json

      - name: Build & type-check Dashboard
        run: |
          cd dashboard
          npm ci
          npm run build

      - name: Build & type-check Mini App
        run: |
          cd mini_app
          npm ci
          npm run build

  deploy-preview:
    needs: [test, frontend]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Vercel CLI
        run: npm i -g vercel@latest
      - name: Pull Vercel Environment
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build Project
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy Preview
        run: vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }}